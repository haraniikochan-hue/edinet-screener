<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TVホーム画面（モック）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E13}
a{color:#F2B263}a:hover{color:#FFD39A}
</style>
<style>
html,body{height:100%;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
</style>
</head>
<body>
<!-- 1920x1080 の静的モック。ウィンドウに合わせて縮小表示する -->
<div id="stage">
<div style="width: 1920px; height: 1080px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0E13; color: #EEF0F3; font-family: 'Zen Kaku Gothic New', sans-serif;">

<svg aria-hidden="true" width="1920" height="520" viewBox="0 0 1920 520" style="position: absolute; left: 0; top: 330px;">
<path d="M0 300 L180 210 L320 260 L470 150 L640 240 L780 190 L960 280 L1120 170 L1280 230 L1460 120 L1640 210 L1800 160 L1920 200 L1920 520 L0 520 Z" fill="#141A23"></path>
<path d="M0 360 L220 290 L400 340 L560 270 L760 330 L940 300 L1100 350 L1300 280 L1500 330 L1700 290 L1920 330 L1920 520 L0 520 Z" fill="#10151D"></path>
<path d="M0 420 L300 390 L620 410 L900 380 L1240 405 L1560 385 L1920 400 L1920 520 L0 520 Z" fill="#0D1118"></path>
</svg>

<div style="position: relative; height: 100%; box-sizing: border-box; padding: 72px 96px 64px; display: flex; flex-direction: column; justify-content: space-between;">

<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 64px;">

<div style="display: flex; flex-direction: column; gap: 28px;">
<div style="display: flex; align-items: baseline; gap: 28px;">
<div style="font-family: 'Outfit', sans-serif; font-weight: 200; font-size: 220px; line-height: 0.9; letter-spacing: -4px;">7:42</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-bottom: 18px;">
<div style="font-size: 36px; font-weight: 500;">10月19日</div>
<div style="font-size: 28px; color: #A9B1BD;">月曜日</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 24px;">
<svg role="img" aria-label="晴れ" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#F2B263" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"></path></svg>
<div style="font-family: 'Outfit', sans-serif; font-weight: 300; font-size: 64px;">21°</div>
<div style="display: flex; flex-direction: column; gap: 4px; font-size: 24px; color: #A9B1BD;">
<div>晴れ　最高 24° / 最低 15°</div>
<div>降水確率 10%</div>
</div>
</div>
</div>

<div style="width: 560px; display: flex; flex-direction: column; gap: 20px;">
<div style="background: rgba(22,28,38,0.86); border-radius: 20px; padding: 28px 32px; display: flex; flex-direction: column; gap: 18px;">
<div style="font-size: 22px; font-weight: 700; color: #A9B1BD; letter-spacing: 2px;">今日の予定</div>
<div style="display: flex; gap: 24px; font-size: 28px;"><span style="font-family: 'Outfit', sans-serif; color: #F2B263; width: 92px;">10:00</span><span>打ち合わせ</span></div>
<div style="display: flex; gap: 24px; font-size: 28px;"><span style="font-family: 'Outfit', sans-serif; color: #F2B263; width: 92px;">13:30</span><span>歯医者</span></div>
<div style="display: flex; gap: 24px; font-size: 28px;"><span style="font-family: 'Outfit', sans-serif; color: #F2B263; width: 92px;">19:00</span><span>ジム</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px;">
<div style="background: rgba(22,28,38,0.86); border-radius: 20px; padding: 24px 28px; display: flex; flex-direction: column; gap: 12px;">
<div style="font-size: 22px; font-weight: 700; color: #A9B1BD; letter-spacing: 2px;">電車</div>
<div style="font-size: 26px;">山手線　平常運転</div>
<div style="font-size: 26px; color: #FFB4A8;">銀座線　5分遅れ</div>
</div>
<div style="background: rgba(22,28,38,0.86); border-radius: 20px; padding: 24px 28px; display: flex; flex-direction: column; gap: 12px;">
<div style="font-size: 22px; font-weight: 700; color: #A9B1BD; letter-spacing: 2px;">ゴミの日</div>
<div style="font-size: 30px; font-weight: 500;">燃えるゴミ</div>
<div style="font-size: 22px; color: #A9B1BD;">8:30までに</div>
</div>
</div>
</div>

</div>

<div style="display: flex; flex-direction: column; gap: 24px;">
<div style="font-size: 24px; font-weight: 700; color: #A9B1BD; letter-spacing: 2px;">アプリ</div>
<div style="display: flex; gap: 28px; align-items: center;">
<button style="width: 248px; height: 140px; border-radius: 20px; border: 4px solid #F2B263; background: #222B38; color: #FFFFFF; font-family: inherit; font-size: 30px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; transform: scale(1.08); box-shadow: 0 16px 40px rgba(0,0,0,0.5);">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8 5.5v13l10.5-6.5z"></path></svg>
SmartTube</button>
<button style="width: 232px; height: 132px; border-radius: 18px; border: 4px solid transparent; background: #171D27; color: #D8DDE4; font-family: inherit; font-size: 28px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
地デジ</button>
<button style="width: 232px; height: 132px; border-radius: 18px; border: 4px solid transparent; background: #171D27; color: #D8DDE4; font-family: inherit; font-size: 28px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"></path></svg>
Netflix</button>
<button style="width: 232px; height: 132px; border-radius: 18px; border: 4px solid transparent; background: #171D27; color: #D8DDE4; font-family: inherit; font-size: 28px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"></path></svg>
Prime Video</button>
<button style="width: 232px; height: 132px; border-radius: 18px; border: 4px solid transparent; background: #171D27; color: #D8DDE4; font-family: inherit; font-size: 28px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M10 9l4 2-4 2z"></path><path d="M8 21h8"></path></svg>
TVer</button>
<button style="width: 232px; height: 132px; border-radius: 18px; border: 4px solid transparent; background: #171D27; color: #D8DDE4; font-family: inherit; font-size: 28px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
設定</button>
</div>
</div>

</div>
</div>
</div>
<script>
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080),el=document.getElementById('stage');
el.style.transform='scale('+s+')';el.style.left=((innerWidth-1920*s)/2)+'px';el.style.top=((innerHeight-1080*s)/2)+'px';}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
